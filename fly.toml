# Fly.io config for the Manteclaw Poe server bot v2.
# Region iad is the cheapest; shared-cpu-1x 256MB always-on is $2.19/mo,
# under Fly.io's under-$5 bill waiver.
# One machine only (the old bot ran two for no reason). Health check on
# /health -- the old app had none configured.
app = "manteclaw-poe-v2"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SURPLUS_MODEL = "deepseek/deepseek-v4.1-flash-1017"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    name = "health"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
